name: Sync upstream (daily)

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'liuweiqiang0523/CF-Server-Monitor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare upstream merge
        id: sync
        run: bash scripts/sync-upstream.sh

      - name: Setup Node.js
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate merged code before publishing
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run test:all
          node --test test/upstream-sync.test.js
          npm run build:frontend

      - name: Publish validated merge
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Deploy current main or recover an unsuccessful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bash scripts/deploy-synced-main.sh

      - name: Record failure
        if: failure()
        run: |
          echo 'Sync or deployment failed. Review the failed step; the next run retries deployment if code was already synced.' >> "$GITHUB_STEP_SUMMARY"
